<title id="t">a deadpan rubber duck wearing a shipping container as a hat</title>
<style>
  .duck { animation: bob 3.4s ease-in-out infinite; }
  .w1 { animation: drift 6s linear infinite; }
  .w2 { animation: drift 9s linear infinite reverse; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-1deg); } }
  @keyframes drift { to { transform: translateX(80px); } }
  @media (prefers-reduced-motion: reduce) { .duck, .w1, .w2 { animation: none; } }
</style>

