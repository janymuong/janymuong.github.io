<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">a rubber duck in sunglasses on a cosy shipping container with a smiling laptop, while another container burns in the distance</title>
<style>
  .ship { animation: bob 3.2s ease-in-out infinite; }
  .w1 { animation: drift 5s linear infinite; }
  .w2 { animation: drift 8s linear infinite reverse; }
  .tick { stroke-dasharray: 100; animation: draw 5s ease-in-out infinite; }
  .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 0.6s ease-in-out infinite alternate; }
  .f2 { animation-duration: 0.45s; } .f3 { animation-duration: 0.75s; }
  .smoke { animation: rise 3s ease-out infinite; } .s2 { animation-delay: 1.5s; }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  .bulb { animation: twinkle 2s ease-in-out infinite; } .b1 { animation-delay: .6s; } .b2 { animation-delay: 1.2s; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes drift { to { transform: translateX(80px); } }
  @keyframes draw { 0% { stroke-dashoffset: 100; } 20%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
  @keyframes flick { to { transform: scale(0.88, 1.18); } }
  @keyframes rise { from { transform: translateY(0); opacity: .7; } to { transform: translateY(-34px); opacity: 0; } }
  @keyframes steam { 50% { transform: translateY(-4px); opacity: .3; } }
  @keyframes twinkle { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- speech bubble: just a tick -->
<path d="M172,62 L248,84 L172,94" fill="#050805" stroke="#39ff14" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="24" y="18" width="150" height="88" rx="12" fill="#050805" stroke="#39ff14" stroke-width="2.5"/>
<line x1="172" y1="65" x2="172" y2="91" stroke="#050805" stroke-width="4"/>
<polyline class="tick" pathLength="100" points="62,64 88,88 138,38" fill="none" stroke="#39ff14" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

<!-- far away: another container, on fire -->
<g>
  <g transform="rotate(-5 565 240)">
    <rect x="520" y="222" width="90" height="40" fill="#050805" stroke="#228b22" stroke-width="2.5"/>
    <g stroke="#1c6e1c" stroke-width="1.5"><line x1="530" y1="226" x2="530" y2="258"/><line x1="540" y1="226" x2="540" y2="258"/><line x1="550" y1="226" x2="550" y2="258"/><line x1="560" y1="226" x2="560" y2="258"/><line x1="570" y1="226" x2="570" y2="258"/><line x1="580" y1="226" x2="580" y2="258"/><line x1="590" y1="226" x2="590" y2="258"/><line x1="600" y1="226" x2="600" y2="258"/></g>
    <g transform="translate(540,222)"><path class="fl" d="M0,0 C-9,-9 -7,-21 0,-32 C2,-23 11,-19 9,-9 C7,-3 4,0 0,0 Z" fill="#b6ff9e"/></g>
    <g transform="translate(565,222) scale(1.5)"><path class="fl f2" d="M0,0 C-9,-9 -7,-21 0,-32 C2,-23 11,-19 9,-9 C7,-3 4,0 0,0 Z" fill="#b6ff9e"/><path class="fl f2" d="M0,0 C-9,-9 -7,-21 0,-32 C2,-23 11,-19 9,-9 C7,-3 4,0 0,0 Z" fill="#39ff14" transform="scale(.55)"/></g>
    <g transform="translate(590,222) scale(1.1)"><path class="fl f3" d="M0,0 C-9,-9 -7,-21 0,-32 C2,-23 11,-19 9,-9 C7,-3 4,0 0,0 Z" fill="#b6ff9e"/></g>
    <circle class="smoke" cx="560" cy="180" r="7" fill="none" stroke="#228b22" stroke-width="2"/>
    <circle class="smoke s2" cx="576" cy="176" r="9" fill="none" stroke="#228b22" stroke-width="2"/>
  </g>
</g>

<g class="ship">
  <!-- container, doors open -->
  <rect x="130" y="150" width="320" height="112" fill="#050805" stroke="#32cd32" stroke-width="3"/>
  <rect x="130" y="150" width="320" height="8" fill="#32cd32"/>
  <polygon points="146,166 118,176 118,246 146,256" fill="#050805" stroke="#32cd32" stroke-width="2.5"/>
  <polygon points="434,166 462,176 462,246 434,256" fill="#050805" stroke="#32cd32" stroke-width="2.5"/>
  <rect x="146" y="166" width="288" height="90" fill="#000" stroke="#228b22" stroke-width="2"/>
  <rect x="126" y="146" width="12" height="12" fill="#39ff14"/><rect x="442" y="146" width="12" height="12" fill="#39ff14"/>
  <rect x="126" y="254" width="12" height="12" fill="#39ff14"/><rect x="442" y="254" width="12" height="12" fill="#39ff14"/>

  <!-- cosy room inside -->
  <circle class="bulb b0" cx="168" cy="172.7" r="2.6" fill="#39ff14"/><circle class="bulb b1" cx="196" cy="174.9" r="2.6" fill="#39ff14"/><circle class="bulb b2" cx="224" cy="176.5" r="2.6" fill="#39ff14"/><circle class="bulb b0" cx="252" cy="177.5" r="2.6" fill="#39ff14"/><circle class="bulb b1" cx="280" cy="178.0" r="2.6" fill="#39ff14"/><circle class="bulb b2" cx="308" cy="177.9" r="2.6" fill="#39ff14"/><circle class="bulb b0" cx="336" cy="177.2" r="2.6" fill="#39ff14"/><circle class="bulb b1" cx="364" cy="176.1" r="2.6" fill="#39ff14"/><circle class="bulb b2" cx="392" cy="174.3" r="2.6" fill="#39ff14"/>
  <polygon points="208,212 246,212 264,248 190,248" fill="#32cd32" opacity="0.08"/>
  <line x1="204" y1="248" x2="404" y2="248" stroke="#228b22" stroke-width="2"/>
  <rect x="180" y="232" width="230" height="6" fill="#228b22"/>
  <line x1="190" y1="238" x2="190" y2="250" stroke="#228b22" stroke-width="3"/><line x1="400" y1="238" x2="400" y2="250" stroke="#228b22" stroke-width="3"/>
  <!-- lamp -->
  <path d="M206,232 L206,206 Q206,196 224,196" fill="none" stroke="#32cd32" stroke-width="3" stroke-linecap="round"/>
  <polygon points="216,196 238,196 246,212 208,212" fill="#b6ff9e"/>
  <!-- laptop with a smile -->
  <rect x="262" y="190" width="84" height="40" rx="3" fill="#050805" stroke="#39ff14" stroke-width="2.5"/>
  <circle cx="290" cy="205" r="3" fill="#39ff14"/><circle cx="318" cy="205" r="3" fill="#39ff14"/>
  <path d="M286,214 Q304,226 322,214" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="252,232 356,232 362,238 246,238" fill="#32cd32"/>
  <!-- mug -->
  <rect x="376" y="218" width="16" height="14" rx="2" fill="#b6ff9e"/>
  <path d="M392,221 q7,0 7,6 t-7,5" fill="none" stroke="#b6ff9e" stroke-width="2"/>
  <path class="steam" d="M381,214 q-3,-5 0,-9 M388,214 q-3,-5 0,-9" fill="none" stroke="#32cd32" stroke-width="1.8" stroke-linecap="round"/>

  <!-- duck on the roof, not looking at the fire -->
  <g transform="translate(340,150)">
    <ellipse cx="-14" cy="-2" rx="11" ry="3.5" fill="#b6ff9e"/>
    <ellipse cx="16" cy="-2" rx="11" ry="3.5" fill="#b6ff9e"/>
    <polygon points="46,-50 76,-70 64,-32" fill="#32cd32"/>
    <ellipse cx="0" cy="-36" rx="56" ry="33" fill="#32cd32"/>
    <path d="M-30,-40 C-10,-18 30,-22 42,-46 C20,-52 -10,-56 -30,-40 Z" fill="#1c6e1c"/>
    <circle cx="-34" cy="-78" r="26" fill="#32cd32"/>
    <ellipse cx="-64" cy="-70" rx="21" ry="8" fill="#b6ff9e"/>
    <path d="M-84,-70 L-48,-70" stroke="#1c6e1c" stroke-width="2"/>
    <rect x="-62" y="-94" width="40" height="14" rx="2" fill="#000"/>
    <line x1="-22" y1="-88" x2="-9" y2="-92" stroke="#000" stroke-width="3"/>
    <line x1="-56" y1="-90" x2="-47" y2="-90" stroke="#39ff14" stroke-width="2"/>
  </g>
</g>

<!-- water -->
<g class="w1"><path d="M-80,258 q20,-10 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 V300 H-80 Z" fill="#000" stroke="#228b22" stroke-width="2.5"/></g>
<g class="w2"><path d="M-80,278 q20,-10 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="#1c6e1c" stroke-width="2.5"/></g>
