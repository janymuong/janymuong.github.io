  <ellipse cx="33" cy="46" rx="5" ry="1.8" fill="#b6ff9e"/>
  <!-- body, tail, wing -->
  <polygon points="12,30 3,22 9,38" fill="#32cd32"/>
  <ellipse cx="28" cy="35" rx="17" ry="11" fill="#32cd32"/>
  <path d="M16,34 C22,44 36,43 40,34 C32,32 22,29 16,34 Z" fill="#1c6e1c"/>
  <!-- head, beak, eye, raised brow -->
  <circle cx="39" cy="20" r="9.5" fill="#32cd32"/>
  <ellipse cx="50" cy="23" rx="6" ry="2.8" fill="#b6ff9e"/>
