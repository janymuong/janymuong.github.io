    <rect x="28" y="4" width="22" height="9" fill="#050805" stroke="#39ff14" stroke-width="1.4"/>
    <g stroke="#228b22" stroke-width="1"><line x1="32" y1="5" x2="32" y2="12"/><line x1="36" y1="5" x2="36" y2="12"/><line x1="40" y1="5" x2="40" y2="12"/><line x1="44" y1="5" x2="44" y2="12"/><line x1="48" y1="5" x2="48" y2="12"/></g>
    <rect x="28" y="4" width="22" height="2" fill="#39ff14"/>
  </g>
