<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 48" width="56" height="48" role="img" aria-label="a small duck in a container hat" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- feet stand on the line -->
