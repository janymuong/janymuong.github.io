<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%2332cd32'%3E%E2%99%A1%3C/text%3E%3C/svg%3E" />
  {{ with resources.Get "css/main.css" }}
    {{ with . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" />
    {{ end }}
  {{ end }}
</head>

<body>
  <main class="page-content" aria-label="Content">
    <div class="w">
      <nav class="crumbs" aria-label="Back">[$] <a href="{{ if .IsHome }}{{ site.Params.landing }}{{ else }}{{ .Parent.RelPermalink }}{{ end }}">cd ..</a></nav>
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
    {{ if .Store.Get "hasMermaid" }}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        fontFamily: "monospace",
        background: "#000000",
        primaryColor: "#050805",
        primaryTextColor: "#39ff14",
        primaryBorderColor: "#32cd32",
        secondaryColor: "#050805",
        tertiaryColor: "#050805",
        lineColor: "#32cd32",
        textColor: "#32cd32",
        clusterBkg: "#050805",
        clusterBorder: "#228b22",
        edgeLabelBackground: "#000000"
      }
    });
    await mermaid.run({ querySelector: "pre.mermaid" });
  </script>
  {{ end }}
</body>

</html>
