{{ define "main" }}
<img class="wom-hero" src="{{ "img/works-on-my-machine.svg" | relURL }}" alt="a deadpan rubber duck wearing a shipping container as a hat" width="640" height="230" />
<div class="terminal-window wide">
  <pre class="terminal-body">┌─[j@yaml-engineer] - [~/{{ .Title }}]
└─[$] ls -l<span class="terminal-cursor">▍</span></pre>
</div>

<h1>{{ .Title }}/</h1>
<p>{{ .Description }}</p>

<p class="total">total {{ len .Pages }}</p>
{{ partial "projects.html" .Pages.ByWeight }}
{{ end }}
